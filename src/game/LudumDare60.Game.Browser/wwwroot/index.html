<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LudumDare60</title>
  <style>
    html,
    body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background: #000;
    }

    #screen {
      display: block;
      width: 100%;
      height: 100%;
    }

    /* Loading and error text over the canvas (boot.js); clicks still reach the canvas. */
    #status {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 16px;
      pointer-events: none;
      color: #c4d8e8;
      font: 16px/1.4 ui-monospace, Menlo, Consolas, monospace;
      text-align: center;
    }

    #status[hidden] {
      display: none;
    }
  </style>
  <link rel="preload" id="webassembly" />
  <script type="importmap"></script>
  <script type="module" src="main#[.{fingerprint}].js"></script>
</head>

<body>
  <canvas id="screen"></canvas>
  <div id="status">Loading...</div>
</body>

</html>
