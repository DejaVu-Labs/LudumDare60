<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LD60 input monitor</title>
  <style>
    html,
    body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background: #0b0f0b;
    }

    #screen {
      display: block;
      width: 100%;
      height: 100%;
    }

    /* Overlays the canvas without taking its pointer events. */
    #monitor {
      position: absolute;
      inset: 0;
      margin: 0;
      padding: 16px;
      overflow: hidden;
      pointer-events: none;
      color: #7dff8a;
      font: 14px/1.35 ui-monospace, Menlo, Consolas, monospace;
      white-space: pre;
    }
  </style>
  <link rel="preload" id="webassembly" />
  <script type="importmap"></script>
  <script type="module" src="main#[.{fingerprint}].js"></script>
</head>

<body>
  <canvas id="screen"></canvas>
  <pre id="monitor">Loading...</pre>
</body>

</html>
