# Downloads a build artifact of deploy.yml and pushes it to one itch.io channel with a pinned, checksummed butler.
name: Push to itch.io with butler
description: Downloads a workflow artifact and pushes it to an itch.io channel.

inputs:
  artifact:
    description: Name of the workflow artifact to push.
    required: true
  target:
    description: itch.io target, <user>/<game>:<channel>.
    required: true
  version:
    description: Version shown on itch.io (--userversion).
    required: true
  api-key:
    description: The BUTLER_API_KEY secret.
    required: true
  executable:
    description: Path inside the artifact to mark executable. Workflow artifacts do not keep file permissions.
    required: false
    default: ''

runs:
  using: composite
  steps:
    - uses: actions/download-artifact@v8
      with:
        name: ${{ inputs.artifact }}
        path: ${{ runner.temp }}/build

    - name: Mark executable
      if: inputs.executable != ''
      shell: bash
      env:
        EXECUTABLE: ${{ runner.temp }}/build/${{ inputs.executable }}
      run: |
        test -f "$EXECUTABLE" || { echo "::error::$EXECUTABLE is missing from the artifact."; exit 1; }
        chmod +x "$EXECUTABLE"

    # To update butler, see docs/tech/build-and-deploy.md#updating-butler.
    - name: Install butler
      shell: bash
      env:
        BUTLER_VERSION: 15.32.0
        BUTLER_SHA256: 2335971394ef6596f95ded0833e85ee28755e13761716ef4c91d6b11f69162f5
      run: |
        archive="$RUNNER_TEMP/butler.zip"
        curl -fsSL -o "$archive" "https://broth.itch.zone/butler/linux-amd64/$BUTLER_VERSION/archive/default"
        echo "$BUTLER_SHA256  $archive" | sha256sum --check --strict
        unzip -q -o "$archive" -d "$RUNNER_TEMP/butler"
        chmod +x "$RUNNER_TEMP/butler/butler"
        echo "$RUNNER_TEMP/butler" >> "$GITHUB_PATH"

    - name: Push
      shell: bash
      env:
        BUTLER_API_KEY: ${{ inputs.api-key }}
        TARGET: ${{ inputs.target }}
        VERSION: ${{ inputs.version }}
        BUILD: ${{ runner.temp }}/build
      run: |
        if [ -z "$BUTLER_API_KEY" ]; then echo "::error::BUTLER_API_KEY is not set in the environment."; exit 1; fi
        butler -V
        butler push "$BUILD" "$TARGET" --userversion "$VERSION" --if-changed
        butler status "$TARGET"
