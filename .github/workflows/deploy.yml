# Publishes the game to itch.io with butler: the Release (AOT) browser build to the html5 channel, and self-contained
# desktop builds to the windows and linux channels.
#
#   tag v*            -> release: vars.ITCH_GAME      (the public game page), environment "itch"
#   push to main      -> dev:     vars.ITCH_DEV_GAME  (a restricted test page), environment "itch-dev"
#   manual run        -> either, picked in the form
#
# Setup (see docs/tech/build-and-deploy.md#continuous-deployment): repository variables ITCH_USER, ITCH_GAME and
# ITCH_DEV_GAME, and a BUTLER_API_KEY secret in both environments. Optional: SENTRY_DSN, GAMEANALYTICS_GAME_KEY and
# GAMEANALYTICS_SECRET_KEY.
name: Deploy

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      target:
        description: Where to push
        type: choice
        options: [dev, release]
        default: dev
      version:
        description: Version shown on itch.io (required for release; dev builds use the run number)
        type: string
        required: false

permissions:
  contents: read

env:
  PUBLISH_DIR: artifacts/publish/LudumDare60.Game.Browser/release/wwwroot
  DESKTOP_PROJECT: src/game/LudumDare60.Game.Desktop

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      target: ${{ steps.plan.outputs.target }}
      environment: ${{ steps.plan.outputs.environment }}
      project: ${{ steps.plan.outputs.project }}
      version: ${{ steps.plan.outputs.version }}
    steps:
      # Fails here, before the long AOT build, when the itch.io settings are missing.
      - id: plan
        name: Choose target and version
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_TARGET: ${{ inputs.target }}
          INPUT_VERSION: ${{ inputs.version }}
          ITCH_USER: ${{ vars.ITCH_USER }}
          ITCH_GAME: ${{ vars.ITCH_GAME }}
          ITCH_DEV_GAME: ${{ vars.ITCH_DEV_GAME }}
        run: |
          if [ "$REF_TYPE" = tag ] || [ "$INPUT_TARGET" = release ]; then
            target=release environment=itch game=$ITCH_GAME
            if [ "$REF_TYPE" = tag ]; then version=${REF_NAME#v}; else version=$INPUT_VERSION; fi
            if [ -z "$version" ]; then echo "::error::A release needs a version (tag v<version> or the version input)."; exit 1; fi
          else
            target=dev environment=itch-dev game=$ITCH_DEV_GAME
            version="dev-$GITHUB_RUN_NUMBER-${GITHUB_SHA::7}"
          fi
          if [ -z "$ITCH_USER" ] || [ -z "$game" ]; then
            echo "::error::Set the repository variables ITCH_USER, ITCH_GAME and ITCH_DEV_GAME (Settings > Secrets and variables > Actions > Variables)."
            exit 1
          fi
          project="$ITCH_USER/$game"
          {
            echo "target=$target"
            echo "environment=$environment"
            echo "project=$project"
            echo "version=$version"
          } >> "$GITHUB_OUTPUT"
          echo "Deploying $version to $project, channels html5, windows and linux ($target)" >> "$GITHUB_STEP_SUMMARY"

  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  publish:
    name: Publish (Release AOT)
    needs: [plan, ci]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      # AOT needs the wasm-tools workload. The workload set comes from sdk.workloadVersion in global.json, so CI and
      # local builds use the same runtime pack and toolchain.
      - name: Install wasm-tools workload
        run: dotnet workload install wasm-tools

      - name: Publish
        run: dotnet publish src/game/LudumDare60.Game.Browser -c Release

      # Error and load reports to Sentry (reporting.js) stay off unless the SENTRY_DSN repository variable is set.
      # The published reporting.json is "{}" otherwise.
      - name: Write reporting config
        if: vars.SENTRY_DSN != ''
        env:
          SENTRY_DSN: ${{ vars.SENTRY_DSN }}
          RELEASE: ${{ needs.plan.outputs.version }}
          ENVIRONMENT: ${{ needs.plan.outputs.target }}
        run: |
          jq -n --arg dsn "$SENTRY_DSN" --arg release "$RELEASE" --arg environment "$ENVIRONMENT" \
            '{dsn: $dsn, release: $release, environment: $environment}' > "$PUBLISH_DIR/reporting.json"
          echo "Sentry reporting on: $ENVIRONMENT $RELEASE" >> "$GITHUB_STEP_SUMMARY"

      # Product analytics (analytics.js) stay off unless both GameAnalytics keys are set as repository variables. The
      # published analytics.json is "{}" otherwise. The keys ship to every player anyway, like the Sentry DSN.
      - name: Write analytics config
        if: vars.GAMEANALYTICS_GAME_KEY != '' && vars.GAMEANALYTICS_SECRET_KEY != ''
        env:
          GAME_KEY: ${{ vars.GAMEANALYTICS_GAME_KEY }}
          SECRET_KEY: ${{ vars.GAMEANALYTICS_SECRET_KEY }}
          BUILD: ${{ needs.plan.outputs.version }}
        run: |
          jq -n --arg gameKey "$GAME_KEY" --arg secretKey "$SECRET_KEY" --arg build "$BUILD" \
            '{gameKey: $gameKey, secretKey: $secretKey, build: $build}' > "$PUBLISH_DIR/analytics.json"
          echo "GameAnalytics on: $BUILD" >> "$GITHUB_STEP_SUMMARY"

      # itch.io HTML5 limits: index.html at the root, at most 1000 files.
      - name: Check output
        run: |
          test -f "$PUBLISH_DIR/index.html" || { echo "::error::index.html is missing from $PUBLISH_DIR"; exit 1; }
          files=$(find "$PUBLISH_DIR" -type f | wc -l)
          size=$(du -sh "$PUBLISH_DIR" | cut -f1)
          echo "Build: $files files, $size" >> "$GITHUB_STEP_SUMMARY"
          if [ "$files" -gt 1000 ]; then echo "::error::$files files; itch.io allows at most 1000."; exit 1; fi

      - uses: actions/upload-artifact@v7
        with:
          name: html5
          path: ${{ env.PUBLISH_DIR }}
          if-no-files-found: error
          retention-days: 14

  # Self-contained desktop builds, cross-published from Linux: one executable plus SDL3 and the assets, no .NET
  # install needed. See docs/tech/build-and-deploy.md#desktop-build.
  publish-desktop:
    name: Publish (${{ matrix.channel }})
    needs: [plan, ci]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - channel: windows
            runtime: win-x64
            executable: LudumDare60.Game.Desktop.exe
          - channel: linux
            runtime: linux-x64
            executable: LudumDare60.Game.Desktop
    env:
      DESKTOP_PUBLISH_DIR: artifacts/publish/LudumDare60.Game.Desktop/release_${{ matrix.runtime }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      # The SDK refuses to evaluate any project of the repository until the workload set pinned in global.json is
      # installed, desktop ones included.
      - name: Install wasm-tools workload
        run: dotnet workload install wasm-tools

      # DesktopRuntime, not -r: -r would give the RID to the libraries too, and their lock files have none.
      - name: Publish
        run: dotnet publish "$DESKTOP_PROJECT" -c Release -p:DesktopRuntime=${{ matrix.runtime }}

      # The same reports and analytics as the browser build, under the same variables. Without them the files are
      # missing and the desktop build sends nothing. Events carry the game.platform tag (Sentry) or the platform field
      # (GameAnalytics), so the dashboards can tell the builds apart.
      - name: Write reporting config
        if: vars.SENTRY_DSN != ''
        env:
          SENTRY_DSN: ${{ vars.SENTRY_DSN }}
          RELEASE: ${{ needs.plan.outputs.version }}
          ENVIRONMENT: ${{ needs.plan.outputs.target }}
        run: |
          jq -n --arg dsn "$SENTRY_DSN" --arg release "$RELEASE" --arg environment "$ENVIRONMENT" \
            '{dsn: $dsn, release: $release, environment: $environment}' > "$DESKTOP_PUBLISH_DIR/reporting.json"

      - name: Write analytics config
        if: vars.GAMEANALYTICS_GAME_KEY != '' && vars.GAMEANALYTICS_SECRET_KEY != ''
        env:
          GAME_KEY: ${{ vars.GAMEANALYTICS_GAME_KEY }}
          SECRET_KEY: ${{ vars.GAMEANALYTICS_SECRET_KEY }}
          BUILD: ${{ needs.plan.outputs.version }}
        run: |
          jq -n --arg gameKey "$GAME_KEY" --arg secretKey "$SECRET_KEY" --arg build "$BUILD" \
            '{gameKey: $gameKey, secretKey: $secretKey, build: $build}' > "$DESKTOP_PUBLISH_DIR/analytics.json"

      - name: Check output
        env:
          EXECUTABLE: ${{ matrix.executable }}
        run: |
          test -f "$DESKTOP_PUBLISH_DIR/$EXECUTABLE" || { echo "::error::$EXECUTABLE is missing from $DESKTOP_PUBLISH_DIR"; exit 1; }
          test -d "$DESKTOP_PUBLISH_DIR/assets" || { echo "::error::assets/ is missing from $DESKTOP_PUBLISH_DIR"; exit 1; }
          test -f "$DESKTOP_PUBLISH_DIR/README.txt" || { echo "::error::README.txt is missing from $DESKTOP_PUBLISH_DIR"; exit 1; }
          files=$(find "$DESKTOP_PUBLISH_DIR" -type f | wc -l)
          size=$(du -sh "$DESKTOP_PUBLISH_DIR" | cut -f1)
          echo "${{ matrix.channel }}: $files files, $size" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.channel }}
          path: ${{ env.DESKTOP_PUBLISH_DIR }}
          if-no-files-found: error
          retention-days: 14

  # One push job per build, so a broken desktop build never holds back the browser one. The environment holds
  # BUTLER_API_KEY, so only these jobs see it. Add required reviewers to "itch" to approve each release by hand.
  push:
    name: Push to itch.io (${{ needs.plan.outputs.target }}, html5)
    needs: [plan, publish]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: ${{ needs.plan.outputs.environment }}
    concurrency:
      group: itch-${{ needs.plan.outputs.target }}-html5
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github/actions

      - uses: ./.github/actions/butler-push
        with:
          artifact: html5
          target: ${{ needs.plan.outputs.project }}:html5
          version: ${{ needs.plan.outputs.version }}
          api-key: ${{ secrets.BUTLER_API_KEY }}

  push-desktop:
    name: Push to itch.io (${{ needs.plan.outputs.target }}, ${{ matrix.channel }})
    needs: [plan, publish-desktop]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: ${{ needs.plan.outputs.environment }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - channel: windows
          - channel: linux
            executable: LudumDare60.Game.Desktop
    concurrency:
      group: itch-${{ needs.plan.outputs.target }}-${{ matrix.channel }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github/actions

      - uses: ./.github/actions/butler-push
        with:
          artifact: ${{ matrix.channel }}
          target: ${{ needs.plan.outputs.project }}:${{ matrix.channel }}
          version: ${{ needs.plan.outputs.version }}
          api-key: ${{ secrets.BUTLER_API_KEY }}
          executable: ${{ matrix.executable }}
